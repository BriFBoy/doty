name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          RUSTFLAGS: -C linker=musl-gcc
      - name: Create release binary
        run: cp target/x86_64-unknown-linux-musl/release/doty doty-x86_64-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: doty-x86_64-linux-musl
          path: doty-x86_64-linux-musl

  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Add musl target
        run: rustup target add aarch64-unknown-linux-musl
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-musl
        env:
          RUSTFLAGS: -C linker=musl-gcc
      - name: Create release binary
        run: cp target/aarch64-unknown-linux-musl/release/doty doty-aarch64-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: doty-aarch64-linux-musl
          path: doty-aarch64-linux-musl

  release:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "doty $GITHUB_REF_NAME" \
            artifacts/doty-x86_64-linux-musl/doty-x86_64-linux-musl \
            artifacts/doty-aarch64-linux-musl/doty-aarch64-linux-musl
